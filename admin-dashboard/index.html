<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Admin & CRUD Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --sidebar-bg: #0f1626;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 1.5rem;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid var(--card-border);
      background: linear-gradient(90deg, #ffffff, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-list {
      padding: 1rem 0.75rem;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0.75rem 0.75rem 0.25rem 0.75rem;
      text-transform: uppercase;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .nav-item.active {
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-weight: 600;
    }

    .nav-item.active .badge {
      background: var(--primary);
      color: #fff;
    }

    /* Main Content Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid var(--card-border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 22, 38, 0.5);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .db-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    /* Buttons & Inputs */
    .btn {
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.78rem; border-radius: 8px; }

    .input-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .search-input, .form-control {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus, .form-control:focus {
      border-color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }

    /* Cards & Grids */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-val {
      font-size: 2rem;
      font-weight: 800;
    }

    /* Table Container & Layout */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .table-header-toolbar {
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .table-scroll-wrapper {
      overflow-x: auto;
      width: 100%;
      max-height: calc(100vh - 280px);
      overflow-y: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    .data-table th {
      position: sticky;
      top: 0;
      background: #111827;
      padding: 1rem 1.25rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      z-index: 10;
    }

    .data-table td {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Sticky Actions Column */
    .sticky-actions {
      position: sticky;
      right: 0;
      background: #111827;
      border-left: 1px solid var(--card-border);
      z-index: 5;
      width: 140px;
      text-align: center;
    }

    .data-table td.sticky-actions {
      background: #111827;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: min(750px, 94vw);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .code-block {
      background: rgba(0, 0, 0, 0.5);
      padding: 1.25rem;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace, monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
      <span>DB Admin Portal</span>
    </div>
    <nav class="nav-list">
      <div class="nav-label">Dashboard</div>
      <div class="nav-item active" id="nav-overview" onclick="switchTab('overview')">
        <span>Overview</span>
      </div>
      <div class="nav-item" id="nav-sql" onclick="switchTab('sql')">
        <span>SQL Runner</span>
      </div>

      <div class="nav-label">Tables</div>
      <div id="sidebar-tables"></div>
    </nav>
  </aside>

  <!-- Main Viewport -->
  <main class="main">
    <header class="topbar">
      <div class="db-status">
        <span class="status-dot"></span>
        <span id="db-conn-text">PostgreSQL (demo_db:5432)</span>
      </div>
      <div class="input-group">
        <button class="btn btn-secondary btn-sm" onclick="loadOverview()">Refresh Status</button>
      </div>
    </header>

    <div class="content" id="main-content">
      <!-- Content renders dynamically via JavaScript -->
    </div>
  </main>

  <!-- Form Modal -->
  <div class="modal-overlay" id="form-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title" class="font-semibold text-lg">Record Form</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-fields"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modal-save-btn">Save Record</button>
      </div>
    </div>
  </div>

  <!-- JSON View Modal -->
  <div class="modal-overlay" id="json-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="font-semibold text-lg">Raw JSON Inspector</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeJsonModal()">✕</button>
      </div>
      <div class="modal-body">
        <pre class="code-block" id="json-content"></pre>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeJsonModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'overview';
    let currentTable = '';
    let tableData = [];
    let tableColumns = [];
    let overviewData = {};

    const TABLES = ["users", "profiles", "certificates", "seminars", "files", "resume_history"];

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebarTables();
      loadOverview();
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderSidebarTables() {
      const container = document.getElementById('sidebar-tables');
      container.innerHTML = TABLES.map(t => `
        <div class="nav-item" id="nav-${t}" onclick="selectTable('${t}')">
          <span style="text-transform: capitalize;">${t.replace('_', ' ')}</span>
          <span class="badge" id="count-${t}">-</span>
        </div>
      `).join('');
    }

    async function loadOverview() {
      try {
        const res = await fetch('/api/overview');
        overviewData = await res.json();
        
        TABLES.forEach(t => {
          const el = document.getElementById(`count-${t}`);
          if (el) el.textContent = overviewData.tables[t] ?? 0;
        });

        if (currentTab === 'overview') {
          renderOverview();
        }
      } catch (err) {
        console.error('Failed to load overview', err);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`nav-${tab}`);
      if (activeEl) activeEl.classList.add('active');

      if (tab === 'overview') {
        renderOverview();
      } else if (tab === 'sql') {
        renderSqlRunner();
      }
    }

    function renderOverview() {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem;">Database Overview</h2>
        <div class="grid-cards">
          ${TABLES.map(t => `
            <div class="card" style="cursor: pointer;" onclick="selectTable('${t}')">
              <div class="card-title" style="text-transform: uppercase;">${t.replace('_', ' ')}</div>
              <div class="card-val">${overviewData.tables?.[t] ?? 0}</div>
              <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.5rem;">Click to inspect & edit data →</div>
            </div>
          `).join('')}
        </div>

        <div class="card" style="margin-top: 1.5rem;">
          <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;">Database Info</h3>
          <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.8;">
            <strong>Database Engine:</strong> PostgreSQL 16+<br>
            <strong>Host:</strong> ${overviewData.host || 'localhost'}:${overviewData.port || '5432'}<br>
            <strong>Active Database:</strong> ${overviewData.database || 'demo_db'}<br>
            <strong>Admin Connection Status:</strong> <span style="color: var(--accent); font-weight: 600;">ACTIVE (OK)</span>
          </p>
        </div>
      `;
    }

    async function selectTable(table) {
      currentTab = 'table';
      currentTable = table;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${table}`);
      if (activeNav) activeNav.classList.add('active');

      const content = document.getElementById('main-content');
      content.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div>
            <h2 style="font-size: 1.5rem; font-weight: 800; text-transform: capitalize;">${table.replace('_', ' ')}</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Manage table rows, insert new entries, or edit records.</p>
          </div>
          <div class="input-group">
            <button class="btn btn-primary" onclick="openAddModal()">+ Add New Record</button>
            <button class="btn btn-secondary btn-sm" onclick="exportCSV()">Export CSV</button>
            <button class="btn btn-secondary btn-sm" onclick="exportJSON()">Export JSON</button>
          </div>
        </div>

        <div class="table-container">
          <div class="table-header-toolbar">
            <input type="text" class="search-input" id="search-box" placeholder="Filter rows..." oninput="filterTable(this.value)" style="width: 300px;">
            <span style="font-size: 0.85rem; color: var(--text-muted);" id="row-count-label">Loading rows...</span>
          </div>
          <div class="table-scroll-wrapper">
            <table class="data-table" id="data-table-el">
              <thead><tr><th>Loading...</th></tr></thead>
              <tbody><tr><td>Loading data from database...</td></tr></tbody>
            </table>
          </div>
        </div>
      `;

      await fetchTableData(table);
    }

    async function fetchTableData(table) {
      try {
        const schemaRes = await fetch(`/api/schema/${table}`);
        const schemaData = await schemaRes.json();
        tableColumns = schemaData.columns || [];

        const res = await fetch(`/api/data/${table}`);
        const result = await res.json();
        tableData = result.data || [];

        renderTableRows(tableData);
      } catch (err) {
        console.error(err);
      }
    }

    function renderTableRows(rows) {
      const label = document.getElementById('row-count-label');
      if (label) label.textContent = `Showing ${rows.length} records`;

      const tableEl = document.getElementById('data-table-el');
      if (!tableEl) return;

      if (rows.length === 0) {
        tableEl.innerHTML = `
          <thead><tr><th>Info</th></tr></thead>
          <tbody><tr><td style="padding: 2rem; text-align: center; color: var(--text-muted);">No records found in table "${currentTable}". Click "+ Add New Record" above.</td></tr></tbody>
        `;
        return;
      }

      const cols = Object.keys(rows[0]);
      const thead = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}<th class="sticky-actions">Actions</th></tr>`;

      const tbody = rows.map((r, rowIdx) => `
        <tr>
          ${cols.map(c => {
            let val = r[c];
            if (val === null || val === undefined) {
              return `<td style="color: var(--text-muted); font-style: italic;">null</td>`;
            }
            if (typeof val === 'object') {
              return `<td><button class="btn btn-secondary btn-sm" onclick="showJsonModalByIdx(${rowIdx}, '${c}')">View JSON</button></td>`;
            }
            const escaped = escapeHtml(val);
            return `<td title="${escaped}">${escaped}</td>`;
          }).join('')}
          <td class="sticky-actions">
            <div style="display: flex; gap: 0.4rem; justify-content: center;">
              <button class="btn btn-secondary btn-sm" onclick="openEditModalByIdx(${rowIdx})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteRecord(${r.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      tableEl.innerHTML = `<thead>${thead}</thead><tbody>${tbody}</tbody>`;
    }

    function filterTable(query) {
      const q = query.toLowerCase();
      const filtered = tableData.filter(r => 
        Object.values(r).some(v => String(v).toLowerCase().includes(q))
      );
      renderTableRows(filtered);
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = `Add Record to ${currentTable}`;
      const fieldsContainer = document.getElementById('modal-fields');
      
      fieldsContainer.innerHTML = `
        <div class="form-grid">
          ${tableColumns
            .filter(c => c.column_name !== 'id')
            .map(c => `
              <div class="form-group ${c.data_type === 'text' || c.data_type.includes('json') ? 'full-width' : ''}">
                <label>${c.column_name} <span style="color: var(--text-muted); font-size: 0.75rem;">(${c.data_type})</span></label>
                ${c.data_type === 'text' || c.data_type.includes('json') ? `
                  <textarea class="form-control" id="field-${c.column_name}" rows="3" placeholder="Enter ${c.column_name}..."></textarea>
                ` : `
                  <input type="${c.data_type.includes('int') ? 'number' : 'text'}" class="form-control" id="field-${c.column_name}" placeholder="Enter ${c.column_name}...">
                `}
              </div>
            `).join('')}
        </div>
      `;

      document.getElementById('modal-save-btn').onclick = submitAddRecord;
      document.getElementById('form-modal').classList.add('active');
    }

    async function submitAddRecord() {
      const payload = {};
      tableColumns.filter(c => c.column_name !== 'id').forEach(c => {
        const el = document.getElementById(`field-${c.column_name}`);
        if (el) {
          let val = el.value;
          if (c.data_type.includes('json') && val.trim()) {
            try { val = JSON.parse(val); } catch (e) {}
          }
          payload[c.column_name] = val;
        }
      });

      try {
        const res = await fetch(`/api/data/${currentTable}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error);

        closeModal();
        loadOverview();
        fetchTableData(currentTable);
      } catch (err) {
        alert(`Error adding record: ${err.message}`);
      }
    }

    function openEditModalByIdx(rowIdx) {
      const record = tableData[rowIdx];
      if (!record) return;

      document.getElementById('modal-title').textContent = `Edit Record #${record.id} in ${currentTable}`;
      const fieldsContainer = document.getElementById('modal-fields');
      
      const cols = Object.keys(record).filter(k => k !== 'id');
      fieldsContainer.innerHTML = `
        <div class="form-grid">
          ${cols.map(k => {
            let val = record[k];
            if (typeof val === 'object' && val !== null) val = JSON.stringify(val, null, 2);
            val = val === null || val === undefined ? '' : String(val);
            const isLong = val.length > 50 || k.includes('bio') || k.includes('skills') || k === 'education' || k === 'projects';

            return `
              <div class="form-group ${isLong ? 'full-width' : ''}">
                <label>${k}</label>
                ${isLong ? `
                  <textarea class="form-control" id="edit-field-${k}" rows="3">${escapeHtml(val)}</textarea>
                ` : `
                  <input type="text" class="form-control" id="edit-field-${k}" value="${escapeHtml(val)}">
                `}
              </div>
            `;
          }).join('')}
        </div>
      `;

      document.getElementById('modal-save-btn').onclick = () => submitEditRecord(record.id);
      document.getElementById('form-modal').classList.add('active');
    }

    async function submitEditRecord(id) {
      const payload = {};
      const cols = Object.keys(tableData[0]).filter(k => k !== 'id');
      cols.forEach(k => {
        const el = document.getElementById(`edit-field-${k}`);
        if (el) {
          let val = el.value;
          if ((k === 'education' || k === 'projects' || k === 'experience' || k === 'publications') && val.trim()) {
            try { val = JSON.parse(val); } catch (e) {}
          }
          payload[k] = val;
        }
      });

      try {
        const res = await fetch(`/api/data/${currentTable}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error);

        closeModal();
        fetchTableData(currentTable);
      } catch (err) {
        alert(`Error updating record: ${err.message}`);
      }
    }

    async function deleteRecord(id) {
      if (!confirm(`Are you sure you want to delete record #${id} from ${currentTable}?`)) return;

      try {
        const res = await fetch(`/api/data/${currentTable}/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.error) throw new Error(json.error);

        loadOverview();
        fetchTableData(currentTable);
      } catch (err) {
        alert(`Error deleting record: ${err.message}`);
      }
    }

    function closeModal() {
      document.getElementById('form-modal').classList.remove('active');
    }

    function showJsonModalByIdx(rowIdx, colKey) {
      const record = tableData[rowIdx];
      if (!record || !record[colKey]) return;
      document.getElementById('json-content').textContent = JSON.stringify(record[colKey], null, 2);
      document.getElementById('json-modal').classList.add('active');
    }

    function closeJsonModal() {
      document.getElementById('json-modal').classList.remove('active');
    }

    function exportCSV() {
      if (!tableData.length) return alert('No data to export');
      const keys = Object.keys(tableData[0]);
      const csv = [
        keys.join(','),
        ...tableData.map(r => keys.map(k => `"${String(r[k] ?? '').replace(/"/g, '""')}"`).join(','))
      ].join('\n');

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentTable}_export.csv`;
      a.click();
    }

    function exportJSON() {
      if (!tableData.length) return alert('No data to export');
      const blob = new Blob([JSON.stringify(tableData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentTable}_export.json`;
      a.click();
    }

    function renderSqlRunner() {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem;">Custom SQL Runner</h2>
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Run SELECT Query (Read-Only Safety Enforcement)</label>
            <textarea class="form-control" id="sql-input" rows="4" style="width: 100%; font-family: monospace; color: #38bdf8;" placeholder="SELECT * FROM users LIMIT 10;"></textarea>
          </div>
          <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="runCustomSql()">▶ Run Query</button>
            <select class="form-control" onchange="document.getElementById('sql-input').value = this.value">
              <option value="">Sample Queries...</option>
              <option value="SELECT id, email, name FROM users;">Select Users</option>
              <option value="SELECT user_id, title, org FROM certificates;">Select Certificates</option>
              <option value="SELECT u.name, p.bio FROM users u JOIN profiles p ON u.id = p.user_id;">Join Users & Profiles</option>
            </select>
          </div>
        </div>

        <div id="sql-results"></div>
      `;
    }

    async function runCustomSql() {
      const query = document.getElementById('sql-input').value.trim();
      const resultsDiv = document.getElementById('sql-results');
      if (!query) return alert('Please enter a SQL query');

      resultsDiv.innerHTML = '<p style="color: var(--text-muted);">Executing query...</p>';

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error);

        if (!json.data || json.data.length === 0) {
          resultsDiv.innerHTML = '<div class="card"><p style="color: var(--text-muted);">Query executed cleanly. 0 rows returned.</p></div>';
          return;
        }

        const cols = Object.keys(json.data[0]);
        resultsDiv.innerHTML = `
          <div class="table-container">
            <div class="table-header-toolbar">
              <span style="font-weight: 700;">Query Results (${json.count} rows)</span>
            </div>
            <div class="table-scroll-wrapper">
              <table class="data-table">
                <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                <tbody>
                  ${json.data.map(r => `
                    <tr>${cols.map(c => `<td>${escapeHtml(r[c])}</td>`).join('')}</tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        resultsDiv.innerHTML = `<div class="card" style="border-color: var(--danger);"><p style="color: var(--danger);">SQL Error: ${err.message}</p></div>`;
      }
    }
  </script>
</body>
</html>
